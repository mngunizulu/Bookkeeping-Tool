name: Build macOS app

on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build macOS application
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --windowed \
            --name "Asart Bookkeeping" \
            run.py

      - name: Create DMG folder
        run: |
          mkdir -p dmg
          cp -R "dist/Asart Bookkeeping.app" dmg/

      - name: Create DMG
        run: |
          hdiutil create \
            -volname "Asart Bookkeeping" \
            -srcfolder dmg \
            -ov \
            -format UDZO \
            "AsartBookkeeping_Setup.dmg"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: AsartBookkeeping-macOS
          path: AsartBookkeeping_Setup.dmg